[package]
name = "weavatrix-worktree"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Bounded, crash-recoverable multi-file worktree edits for source refactoring"
license = "MIT"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
homepage = "https://weavatrix.com"
repository = "https://github.com/sergii-ziborov/weavatrix-worktree"
documentation = "https://docs.rs/weavatrix-worktree"
readme = "README.md"
keywords = ["refactoring", "transaction", "worktree", "text-edit", "weavatrix"]
categories = ["development-tools", "filesystem"]
exclude = ["tools/**", "benchmark-results/**"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
blazingly-json = "0.1.0"
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
weavatrix-refactor-plan = "0.1.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
